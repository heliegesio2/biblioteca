# docs/operations.md#migrations: roda antes do Deployment novo subir. Se falhar, o
# hook impede o upgrade — os pods antigos continuam servindo tráfego.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "biblioteca.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "biblioteca.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "biblioteca.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "biblioteca.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/efbundle"]
          args: ["--connection", "$(ConnectionStrings__Postgres)"]
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.postgresConnectionString }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
