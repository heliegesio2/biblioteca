apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "biblioteca.fullname" . }}
  labels:
    {{- include "biblioteca.labels" . | nindent 4 }}
spec:
  # replicas fica de fora quando o HPA está habilitado: caso contrário, toda
  # reconciliação do Helm reverte o valor calculado pelo autoscaler.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "biblioteca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "biblioteca.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "biblioteca.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "biblioteca.fullname" . }}-config
          env:
            {{- include "biblioteca.env" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
