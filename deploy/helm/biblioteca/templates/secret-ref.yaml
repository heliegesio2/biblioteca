{{/*
Este chart NUNCA cria um Secret com valores reais (CLAUDE.md regra 7). Antes de
`helm install`/`upgrade`, crie o Secret referenciado em `.Values.existingSecret`
(default: biblioteca-secrets) fora do Helm, por exemplo:

  kubectl create secret generic biblioteca-secrets \
    --from-literal=postgres-connection-string="Host=...;Port=5432;Database=biblioteca;Username=...;Password=..." \
    --from-literal=redis-connection-string="host:6379" \
    --from-literal=auth-signing-key="<pelo menos 32 bytes, gerado por ambiente>"

O nome do Secret e as chaves esperadas são configuráveis via `existingSecret` e
`secretKeys` em values.yaml. deployment.yaml e migration-job.yaml consomem essas
chaves via secretKeyRef — nunca um valor literal.
*/}}
